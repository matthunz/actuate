[package]
name = "actuate"
version = "0.23.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A reactive user-interface framework"
repository = "https://github.com/actuate-rs/actuate"

[features]
# Core
std = []
executor = ["std", "dep:tokio"]
rt = ["executor", "tokio/rt-multi-thread"]
tracing = ["dep:tracing"]

# Desktop (Bevy ECS) backend
desktop = ["std", "dep:bevy_app", "dep:bevy_ecs", "dep:bevy_utils", "dep:bevy_winit"]
animation = ["desktop", "dep:bevy_math", "dep:bevy_time", "dep:tokio"]
material = ["ui"]
picking = ["desktop", "dep:bevy_picking"]
ui = [
    "desktop",
    "picking",
    "dep:bevy_color",
    "dep:bevy_input",
    "dep:bevy_input_focus",
    "dep:bevy_text",
    "dep:bevy_ui",
]

# Web (DOM) backend
web = ["std", "dep:wasm-bindgen", "dep:web-sys"]

full = ["animation", "desktop", "material", "rt", "tracing"]
default = ["std"]

[workspace]
members = [
    ".",
    "macros"
]

[dependencies]
actuate-macros = { version = "0.2.0", path = "macros" }
ahash = { version = "0.8.11", default-features = false }
bevy_app = { version = "0.19.0", optional = true }
bevy_color = { version = "0.19.0", optional = true }
bevy_ecs = { version = "0.19.0", optional = true }
bevy_input = { version = "0.19.0", optional = true }
bevy_input_focus = { version = "0.19.0", optional = true }
bevy_math = { version = "0.19.0", optional = true }
bevy_picking = { version = "0.19.0", optional = true }
bevy_text = { version = "0.19.0", optional = true }
bevy_time = { version = "0.19.0", optional = true }
bevy_ui = { version = "0.19.0", optional = true }
bevy_utils = { version = "0.19.0", optional = true }
bevy_winit = { version = "0.19.0", optional = true }
crossbeam-queue = { version = "0.3.11", default-features = false, features = ["alloc"] }
hashbrown = "0.15.2"
slotmap = { version = "1.0.7", default-features = false }
thiserror = { version = "2.0.3", default-features = false }
tracing = { version = "0.1.40", optional = true }
tokio = { version = "1.41.1", features = ["sync"], optional = true }
typeid = "1.0.2"
wasm-bindgen = { version = "0.2.95", optional = true }
web-sys = { version = "0.3.72", optional = true, features = [
    "CharacterData",
    "Document",
    "Element",
    "console",
    "Event",
    "EventTarget",
    "HtmlElement",
    "Node",
    "NodeList",
    "Text",
    "Window",
] }

[dev-dependencies]
bevy = { version = "0.19.0" }
reqwest = { version = "0.12.9", features = ["json"] }
serde = { version = "1.0.215", features = ["derive"] }
tracing-subscriber = "0.3.18"

# The web backend's tests drive a real DOM, so they only build for wasm.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3.72"
wasm-bindgen-futures = "0.4.45"
wasm-bindgen-test = "0.3.45"

[package.metadata.docs.rs]
all-features = true
features = ["bevy_winit/x11"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "counter"
required-features = ["material"]

[[example]]
name = "http"
required-features = ["material", "rt"]

[[example]]
name = "radio_button"
required-features = ["material"]

[[example]]
name = "timer"
required-features = ["desktop"]

[[example]]
name = "web"
required-features = ["web"]

[[example]]
name = "widget_gallery"
required-features = ["material"]
